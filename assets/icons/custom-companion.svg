<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Custom Companion</title>
  <desc id="description">A fixed room display and a smaller wheeled companion display exchange a two-way connection.</desc>
  <metadata>
    Original Custom Companion artwork adapted for visual parity with native RoomOS
    home-screen glyphs. The monochrome mark uses bold rounded geometry, remains
    legible at endpoint scale, and exceeds the 5% transparent safe-area requirement.
  </metadata>

  <!-- Optical sizing matches the visual footprint of native RoomOS glyphs. -->
  <g id="roomos-glyph" transform="translate(56.32 56.32) scale(.78)">
  <!-- Two-way coordination bridge -->
  <g id="connection" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
    <path d="M296 143h64c30 0 54 24 54 54v48"/>
    <path d="M286 375h-51c-30 0-54-24-54-54v-4"/>
  </g>
  <g id="direction-markers" fill="#FFFFFF">
    <path d="m383 240 31 40 31-40a9 9 0 0 0-7-15h-48a9 9 0 0 0-7 15"/>
    <path d="m150 322 31-40 31 40a9 9 0 0 1-7 15h-48a9 9 0 0 1-7-15"/>
  </g>

  <!-- Fixed Parent Room Device -->
  <g id="parent-room-device" fill="#FFFFFF">
    <rect x="41" y="79" width="240" height="150" rx="28" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <path d="M137 229h48v51h-48z"/>
    <rect x="105" y="268" width="112" height="24" rx="12"/>
  </g>

  <!-- Movable Companion Device -->
  <g id="companion-device" fill="#FFFFFF">
    <rect x="301" y="305" width="170" height="105" rx="22" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <path d="M321 418h130" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="18"/>
    <circle cx="326" cy="459" r="21"/>
    <circle cx="446" cy="459" r="21"/>
  </g>
  </g>
</svg>
