<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" role="img" aria-labelledby="title description">
  <title id="title">Custom Companion</title>
  <desc id="description">A fixed room display and a mobile companion display exchange a two-way connection.</desc>
  <metadata>
    Original Custom Companion artwork. Built on a 32-unit grid with rounded geometry
    inspired by the visual language of Momentum Design icons. The canvas is transparent,
    and all artwork stays inside a 6.25% safe area.
  </metadata>

  <!-- Two-way coordination bridge -->
  <g id="connection" fill="none" stroke="#64B4FA" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75">
    <path d="M19.25 8.95h4.15a3.8 3.8 0 0 1 3.8 3.8v2.45"/>
    <path d="M17.75 23.75h-3.1a3.8 3.8 0 0 1-3.8-3.8v-.55"/>
  </g>
  <g id="direction-markers" fill="#64B4FA">
    <path d="m24.95 14.65 2.25 2.6 2.25-2.6a.55.55 0 0 0-.42-.9h-3.66a.55.55 0 0 0-.42.9"/>
    <path d="m8.6 19.95 2.25-2.6 2.25 2.6a.55.55 0 0 1-.42.9H9.02a.55.55 0 0 1-.42-.9"/>
  </g>

  <!-- Fixed Parent Room Device -->
  <g id="parent-room-device" fill="#0353A8">
    <path fill-rule="evenodd" d="M5.5 3.5h11A3.5 3.5 0 0 1 20 7v6a3.5 3.5 0 0 1-3.5 3.5h-11A3.5 3.5 0 0 1 2 13V7a3.5 3.5 0 0 1 3.5-3.5m.35 2.25a1.6 1.6 0 0 0-1.6 1.6v5.3a1.6 1.6 0 0 0 1.6 1.6h10.3a1.6 1.6 0 0 0 1.6-1.6v-5.3a1.6 1.6 0 0 0-1.6-1.6z"/>
    <path d="M9.15 16h3.7v2.1h1.6a1 1 0 0 1 0 2h-6.9a1 1 0 0 1 0-2h1.6z"/>
  </g>

  <!-- Movable Companion Device -->
  <g id="companion-device" fill="#1170CF">
    <path fill-rule="evenodd" d="M20.6 17.7h6a3.4 3.4 0 0 1 3.4 3.4v2.4a3.4 3.4 0 0 1-3.4 3.4h-6a3.4 3.4 0 0 1-3.4-3.4v-2.4a3.4 3.4 0 0 1 3.4-3.4m.2 2.1a1.5 1.5 0 0 0-1.5 1.5v2a1.5 1.5 0 0 0 1.5 1.5h5.6a1.5 1.5 0 0 0 1.5-1.5v-2a1.5 1.5 0 0 0-1.5-1.5z"/>
    <circle cx="20.75" cy="28.55" r="1.1"/>
    <circle cx="26.45" cy="28.55" r="1.1"/>
  </g>
</svg>
